<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="./src/style.css"></head><body><main id="app"><section id="finale-overlay" class="finale-overlay is-visible has-action"><div class="finale-card"><div class="finale-kicker">FIZZY FINDS</div><h2>You found enough!</h2><p>Tap to continue</p><div class="finale-sparkles">✦ ✧ ✦</div><div class="stage-goal">Collect enough mints to progress.</div><button id="stage-continue-button" class="primary-button stage-continue-button" type="button">Continue to Water World <span>→</span></button></div></section></main><output id="test-result"></output><script>
const overlay=document.querySelector('#finale-overlay'); const button=document.querySelector('#stage-continue-button'); let activated=false;
button.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();overlay.classList.remove('has-action');activated=true;});
addEventListener('load',()=>{const r=button.getBoundingClientRect(); const x=r.left+r.width/2,y=r.top+r.height/2; const hit=document.elementFromPoint(x,y); const hitButton=hit===button||button.contains(hit); if(hitButton) hit.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window})); document.querySelector('#test-result').textContent=`hit=${hitButton}; activated=${activated}; classRemoved=${!overlay.classList.contains('has-action')}`; document.body.dataset.uiTest=hitButton&&activated&&!overlay.classList.contains('has-action')?'PASS':'FAIL';});
</script></body></html>
